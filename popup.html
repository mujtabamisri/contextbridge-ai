<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContextBridge AI</title><link rel="stylesheet" href="src/style.css"></head><body><main><header><h2>↗ ContextBridge</h2><small>Capture a conversation. Continue anywhere.</small></header><div id="status">Checking active tab…</div><button id="capture">Capture conversation</button><button id="selection" class="subtle">Capture selected text instead</button><p id="feedback" role="status" aria-live="polite"></p><div class="row"><span id="count">0 messages</span><button id="clear" class="subtle">Clear</button></div><label for="preview">Conversation (review or edit)</label><textarea id="preview" placeholder="Your conversation appears here. You can also paste text manually."></textarea><label for="destination">Continue on</label><select id="destination"></select><button id="transfer">Copy, open & paste into destination</button><button id="copy" class="subtle">Copy only</button><small class="footer">No token bar, no conversation logs, no paid APIs. Long conversations may require scrolling to load older messages. Attachments must be moved separately.</small></main><script type="module" src="src/popup.js"></script></body></html>
